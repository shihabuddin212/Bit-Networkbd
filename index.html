<head>

    content="Bitnetworkbd Ltd – Fast, reliable, and affordable broadband internet and telecom solutions for homes and businesses across Bangladesh." />
  <meta name="keywords"

    rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('rm-theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>
  <title>Bitnetworkbd Ltd – Fast & Reliable Internet</title>
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
